; Azahar's settings for headless runs (tools/wsl/autotest.sh fills the @...@ values). Keys left
; out take Azahar's defaults. Section and key names match %APPDATA%\Azahar\config\qt-config.ini.
[Core]
use_cpu_jit\default=false
use_cpu_jit=true
cpu_clock_percentage\default=false
cpu_clock_percentage=100

[Renderer]
graphics_api\default=false
graphics_api=1
use_hw_shader\default=false
use_hw_shader=true
shaders_accurate_mul\default=false
shaders_accurate_mul=true
async_shader_compilation\default=false
async_shader_compilation=false
use_disk_shader_cache\default=false
use_disk_shader_cache=false
resolution_factor\default=false
resolution_factor=@SCALE@
use_vsync\default=false
use_vsync=false
async_presentation\default=false
async_presentation=false
frame_limit\default=false
frame_limit=@FRAME_LIMIT@

[Data%20Storage]
async_fs_operations\default=false
async_fs_operations=false

[Audio]
output_type\default=false
output_type=1
input_type\default=false
input_type=0

[System]
is_new_3ds\default=false
is_new_3ds=@NEW_3DS@
init_clock\default=false
init_clock=@INIT_CLOCK@
init_time\default=false
init_time=@INIT_TIME@
plugin_loader\default=false
plugin_loader=false

[Miscellaneous]
log_filter\default=true
log_filter=*:Info
check_for_update_on_start\default=false
check_for_update_on_start=false

[UI]
firstStart\default=false
firstStart=false
confirmClose\default=false
confirmClose=false
pauseWhenInBackground\default=false
pauseWhenInBackground=false
enable_discord_presence\default=false
enable_discord_presence=false

[Layout]
layout_option\default=false
layout_option=@LAYOUT@
filter_mode\default=false
filter_mode=false
screen_gap\default=false
screen_gap=0

[WebService]
enable_telemetry\default=false
enable_telemetry=false

[VideoDumping]
output_format\default=false
output_format=@DUMP_FORMAT@
format_options=
video_encoder\default=false
video_encoder=@DUMP_ENCODER@
video_encoder_options\default=false
video_encoder_options="@DUMP_OPTIONS@"
video_bitrate\default=false
video_bitrate=40000000
audio_encoder\default=true
audio_encoder=libvorbis
audio_encoder_options\default=true
audio_encoder_options=
